[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.162.1"
  HUGO_ENV = "production"
  # Zet op "false" als je geen extended versie gebruikt (check: "hugo version" toont "extended")
  HUGO_EXTENDED = "true"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_ENV = "preview"

[context.branch-deploy.environment]
  HUGO_ENV = "preview"

# --- 301-redirects van de oude .be-site (SEO/linkwaarde behouden) ---
# Oude DNN-URL's (met en zonder nl-nl/ taalprefix) naar de nieuwe pagina's.
[[redirects]]
  from = "/voetreflexologie"
  to = "/"
  status = 301
[[redirects]]
  from = "/nl-nl/voetreflexologie"
  to = "/"
  status = 301
[[redirects]]
  from = "/nl-nl"
  to = "/"
  status = 301

[[redirects]]
  from = "/Aanbod"
  to = "/aanbod/"
  status = 301
[[redirects]]
  from = "/nl-nl/Aanbod"
  to = "/aanbod/"
  status = 301

[[redirects]]
  from = "/Martine-Smet"
  to = "/over/"
  status = 301
[[redirects]]
  from = "/nl-nl/Martine-Smet"
  to = "/over/"
  status = 301

[[redirects]]
  from = "/Cursus-work-shops"
  to = "/cursussen/"
  status = 301
[[redirects]]
  from = "/nl-nl/Cursus-work-shops"
  to = "/cursussen/"
  status = 301

[[redirects]]
  from = "/Contact"
  to = "/contact/"
  status = 301
[[redirects]]
  from = "/nl-nl/Contact"
  to = "/contact/"
  status = 301

# Nette 404-pagina
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404