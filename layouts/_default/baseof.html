<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ if .Params.metaTitle }}{{ .Params.metaTitle }}{{ else }}{{ .Title }}{{ end }}</title>
<meta name="description" content="{{ .Description }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ if .Params.metaTitle }}{{ .Params.metaTitle }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ .Description }}">
<meta property="og:locale" content="{{ .Site.Params.ogLocale }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,400&family=Figtree:wght@300;400;500;600&display=swap" rel="stylesheet">
{{ block "head" . }}{{ end }}
{{ $css := "style.css" }}{{ if eq .Site.Params.theme "medical" }}{{ $css = "style-medical.css" }}{{ end }}
<link rel="stylesheet" href="{{ $css | relURL }}">
</head>
<body>
{{ partial "header.html" . }}
{{ block "main" . }}{{ end }}
{{ partial "footer.html" . }}
<script src="{{ "script.js" | relURL }}"></script>
{{ partial "analytics.html" . }}
</body>
</html>
