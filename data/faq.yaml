- vraag: "Wat is voetreflexologie?"
  antwoord: "<p>Voetreflexologie vertrekt vanuit het idee dat zones op de voeten in verbinding staan met organen, spieren en wervels. Door die reflexzones gericht te stimuleren, ondersteunen we het zelfregulerend vermogen van je lichaam en kom je tot rust. We kijken altijd naar de hele mens, nooit naar één symptoom.</p>"

- vraag: "Waarvoor kan een behandeling ondersteunend zijn?"
  antwoord: "<p>Voetreflexologie werkt complementair en preventief. Veel mensen komen voor diepe ontspanning, bij spanning, stress of vermoeidheid; daarnaast kan ze de doorstroming bevorderen en de natuurlijke weerstand ondersteunen. Een behandeling stelt geen diagnose en is geen medische behandeling.</p>"

- vraag: "Vervangt voetreflexologie een bezoek aan de dokter?"
  antwoord: "<p>Nee. De behandelingen zijn een aanvulling en geen vervanging van medische zorg. Voor diagnoses en medische klachten blijf je steeds bij je (huis)arts. Bestaande aandoeningen of twijfels bespreken we tijdens de anamnese.</p>"

- vraag: "Hoe verloopt een eerste afspraak?"
  antwoord: "<p>Een eerste sessie start met een uitgebreide anamnese: we overlopen samen je gezondheid, je klachten en wat je verwacht. Zo stemmen we de behandeling op jou af en gaan we na of er geen contra-indicaties zijn. Daarna volgt de behandeling zelf.</p>"

- vraag: "Hoe lang duurt een sessie?"
  antwoord: "<p>Dat hangt af van de behandeling. Een Egyptische voetmassage duurt bijvoorbeeld ongeveer twee uur; een reguliere sessie voetreflexologie is korter.</p>"
  note: "Exacte duur van een standaardsessie hier aan te vullen."

- vraag: "Wat kost een behandeling?"
  antwoord: "<p>Je krijgt vooraf altijd duidelijkheid over de prijs van je behandeling, zodat je nooit voor verrassingen staat.</p>"
  note: "Tarieven per behandeling hier aan te vullen."

- vraag: "Betaalt mijn mutualiteit een deel terug?"
  antwoord: "<p>Veel mutualiteiten betalen een deel van de sessies terug wanneer je therapeut is aangesloten bij een erkende beroepsvereniging. Martine is lid van BeVo. Vraag bij je eigen mutualiteit na welke voorwaarden en bedragen bij jou gelden.</p>"

- vraag: "Hoeveel sessies heb ik nodig?"
  antwoord: "<p>Dat verschilt van persoon tot persoon en hangt af van je situatie en je doel. Sommige mensen komen eenmalig voor ontspanning, anderen kiezen voor een reeks. We bekijken het samen, zonder verplichting.</p>"

- vraag: "Is een behandeling geschikt voor kinderen of tijdens de zwangerschap?"
  antwoord: "<p>Voetreflexologie is geschikt voor jong en oud. Voor specifieke situaties, zoals een zwangerschap of een bestaande aandoening, stemmen we de aanpak af tijdens de anamnese. Bij twijfel overleg je dit best ook met je arts.</p>"

- vraag: "Hoe maak ik een afspraak?"
  antwoord: "<p>Consultatie is steeds op afspraak. Je belt naar 0498 41 60 80 of mailt naar info@hand-en-voetreflexologie.be, en we plannen samen een moment. De praktijk ligt in de Baron Leroystraat 144 in Deurne.</p>"
